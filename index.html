<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Küçükkuyu Fenerbahçe Gönüllüleri Taraftar Kartı</title>

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#f3f6fb;
      color:#062a4d;
      min-height:100vh;
      display:flex;
      justify-content:center;
    }

    .container{
      width:100%;
      max-width:520px;
      padding:36px 18px;
      box-sizing:border-box;
      text-align:center;
    }

    h1{
      font-size:22px;
      line-height:1.25;
      margin:0 0 26px;
      color:#062a4d;
    }

    .card{
      background:#ffffff;
      border-radius:24px;
      padding:28px 22px;
      box-shadow:0 8px 30px rgba(0,0,0,.08);
    }

    .status{
      display:inline-block;
      padding:10px 18px;
      border-radius:30px;
      font-weight:bold;
      margin-bottom:18px;
    }

    .aktif{
      background:#dff5e6;
      color:#137333;
    }

    .pasif{
      background:#fde2e2;
      color:#b3261e;
    }

    .name{
      font-size:28px;
      font-weight:bold;
      margin:8px 0 22px;
    }

    .row{
      text-align:left;
      margin:14px 0;
      font-size:17px;
      border-bottom:1px solid #eeeeee;
      padding-bottom:10px;
    }

    .label{
      color:#777777;
      font-size:13px;
      display:block;
      margin-bottom:4px;
    }

    .footer{
      margin-top:22px;
      font-size:13px;
      color:#8b98a8;
    }

    .error{
      font-size:19px;
      color:#333333;
      line-height:1.5;
    }

    .loading{
      font-size:18px;
      color:#555555;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>
    KÜÇÜKKUYU FENERBAHÇE GÖNÜLLÜLERİ<br>
    TARAFTAR KARTI
  </h1>

  <div class="card" id="kart">
    <div class="loading">Kart bilgileri yükleniyor...</div>
  </div>

  <div class="footer">
    Küçükkuyu Fenerbahçe Gönüllüleri
  </div>

</div>

<script>
  const API_URL =
    "https://script.google.com/macros/s/AKfycbxVtkLyFSNTwJmyg9qyiA7ouvU4xoAJlNTozajUYCUML-vIt1I1aI9vrEwg-VdMOzJb/exec";

  const params = new URLSearchParams(window.location.search);
  const kod = params.get("k");

  window.kartVerisi = function(member) {
    const kart = document.getElementById("kart");

    if (!member || !member.found) {
      kart.innerHTML =
        '<div class="error">Kart doğrulanamadı.<br><br>' +
        (member && member.reason ? member.reason : 'Geçersiz kart.') +
        '</div>';
      return;
    }

    const durumClass = member.aktif ? "aktif" : "pasif";

    kart.innerHTML = `
      <div class="status ${durumClass}">
        ${member.durum}
      </div>

      <div class="name">
        ${member.adSoyad}
      </div>

      <div class="row">
        <span class="label">Üye No</span>
        ${member.uyeNo}
      </div>

      <div class="row">
        <span class="label">Üyelik Tipi</span>
        ${member.tip}
      </div>

      <div class="row">
        <span class="label">Aylık Aidat</span>
        ${member.aylikAidat} TL
      </div>

      <div class="row">
        <span class="label">Son Ödeme</span>
        ${member.sonOdeme}
      </div>
    `;
  };

  if (!kod) {
    document.getElementById("kart").innerHTML =
      '<div class="error">Kart kodu bulunamadı.</div>';
  } else {
    const script = document.createElement("script");

    script.src =
      API_URL +
      "?k=" + encodeURIComponent(kod) +
      "&json=1&callback=kartVerisi";

    script.onerror = function() {
      document.getElementById("kart").innerHTML =
        '<div class="error">Kart bilgileri alınamadı.</div>';
    };

    document.body.appendChild(script);
  }
</script>

</body>
</html>
