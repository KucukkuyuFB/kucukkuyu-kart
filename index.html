<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Küçükkuyu Fenerbahçe Gönüllüleri Taraftar Kartı</title>
  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#062a4d;min-height:100vh;display:flex;justify-content:center}
    .container{width:100%;max-width:520px;padding:36px 18px;box-sizing:border-box;text-align:center}
    h1{font-size:22px;line-height:1.3;margin:0 0 26px}
    .card{background:#fff;border-radius:24px;padding:28px 22px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
    .status{display:inline-block;padding:10px 18px;border-radius:30px;font-weight:bold;margin-bottom:18px}
    .aktif{background:#dff5e6;color:#137333}
    .pasif{background:#fde2e2;color:#b3261e}
    .name{font-size:28px;font-weight:bold;margin:8px 0 22px}
    .row{text-align:left;margin:14px 0;font-size:17px;border-bottom:1px solid #eee;padding-bottom:10px}
    .label{color:#777;font-size:13px;display:block;margin-bottom:4px}
    .footer{margin-top:22px;font-size:13px;color:#8b98a8}
    .error{font-size:19px;color:#333;line-height:1.5}
  </style>
</head>
<body>
<div class="container">
  <h1>KÜÇÜKKUYU FENERBAHÇE GÖNÜLLÜLERİ<br>TARAFTAR KARTI</h1>
  <div class="card" id="kart">Kart bilgileri yükleniyor...</div>
  <div class="footer">Küçükkuyu Fenerbahçe Gönüllüleri</div>
</div>

<script>
const kod = new URLSearchParams(window.location.search).get("k");

function guvenli(v){
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

if (!kod) {
  document.getElementById("kart").innerHTML =
    '<div class="error">Kart kodu bulunamadı.</div>';
} else {
  fetch("./members.json?v=" + Date.now(), {cache:"no-store"})
    .then(r => {
      if (!r.ok) throw new Error("members.json bulunamadı");
      return r.json();
    })
    .then(members => {
      const member = members[kod];
      if (!member) {
        document.getElementById("kart").innerHTML =
          '<div class="error">Kart doğrulanamadı.<br><br>Geçersiz kart.</div>';
        return;
      }

      const aktif = String(member.durum || "").trim().toLowerCase() === "aktif";
      const durumClass = aktif ? "aktif" : "pasif";

      document.getElementById("kart").innerHTML = `
        <div class="status ${durumClass}">${guvenli(member.durum)}</div>
        <div class="name">${guvenli(member.adSoyad)}</div>
        <div class="row"><span class="label">Üye No</span>${guvenli(member.uyeNo)}</div>
        <div class="row"><span class="label">Üyelik Tipi</span>${guvenli(member.tip)}</div>
        <div class="row"><span class="label">Aylık Aidat</span>${guvenli(member.aylikAidat)} TL</div>
        <div class="row"><span class="label">Son Ödeme</span>${guvenli(member.sonOdeme)}</div>
      `;
    })
    .catch(() => {
      document.getElementById("kart").innerHTML =
        '<div class="error">Kart bilgileri alınamadı.</div>';
    });
}
</script>
</body>
</html>
