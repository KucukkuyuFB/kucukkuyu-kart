<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Küçükkuyu Fenerbahçe Gönüllüleri Taraftar Kartı</title>
<style>
:root{--navy:#071d49;--navy2:#103c7a;--yellow:#ffd500;--cream:#f7f3e6;--green:#17823b;--red:#b42318}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(180deg,#ffd500 0%,#ffd500 42%,#f3f5f8 42%);min-height:100vh;color:#0b1e3d}
.wrap{width:100%;max-width:520px;margin:auto;padding:22px 16px 36px}
.top{text-align:center;color:#071d49;padding:8px 8px 18px}
.logo{
  width:220px;
  height:220px;
  object-fit:contain;
  display:block;
  margin:0 auto 10px;
  opacity:1;
  filter:none;
}
.title{font-size:21px;font-weight:900;line-height:1.2;margin:8px 0 4px;letter-spacing:.3px}
.subtitle{font-size:13px;font-weight:800;letter-spacing:1.6px;color:#071d49}
.card{background:white;border-radius:26px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.22);border:1px solid rgba(255,213,0,.45)}
.band{height:9px;background:linear-gradient(90deg,var(--yellow) 0 50%,var(--navy) 50% 100%)}
.content{padding:26px 22px 24px;background:linear-gradient(180deg,#fff,#fbfaf4)}
.status{display:inline-block;padding:9px 17px;border-radius:999px;font-size:13px;font-weight:900;letter-spacing:.5px}
.aktif{background:#dff4e5;color:var(--green)}
.pasif{background:#fde3e1;color:var(--red)}
.name{font-size:29px;font-weight:900;color:var(--navy);margin:16px 0 6px}
.type{display:inline-block;background:#fff4ba;color:var(--navy);font-size:14px;font-weight:800;padding:7px 13px;border-radius:999px;margin-bottom:18px}
.memberNo{font-size:12px;color:#667085;text-transform:uppercase;letter-spacing:1px;margin-top:3px}
.memberNo strong{display:block;color:var(--navy);font-size:24px;letter-spacing:1px;margin-top:3px}
.grid{margin-top:20px;border:1px solid #e9edf3;border-radius:18px;overflow:hidden;background:#fff}
.row{display:flex;justify-content:space-between;gap:16px;text-align:left;padding:15px 16px;border-bottom:1px solid #edf0f4}
.row:last-child{border-bottom:0}
.label{font-size:12px;color:#7b8494;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.value{font-size:16px;color:#111f3a;font-weight:800;text-align:right}
.qrBox{margin-top:20px;background:#fff;border:1px solid #e9edf3;border-radius:18px;padding:16px;text-align:center}
.qrTitle{font-size:12px;color:#7b8494;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.qrImage{width:180px;height:180px;object-fit:contain;display:block;margin:0 auto 8px;background:#fff}
.qrNote{font-size:11px;color:#8a93a2;line-height:1.4}
.code{margin-top:17px;font-size:11px;color:#8a93a2;word-break:break-all}
.footer{text-align:center;margin-top:15px;color:#dbe5f6;font-size:12px}
.loading,.error{padding:34px 20px;text-align:center;font-size:18px}
</style>
</head>

<script>
const kod=new URLSearchParams(location.search).get("k");
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function hata(m){document.getElementById("kart").className="error";document.getElementById("kart").innerHTML=m}
if(!kod){hata("Kart kodu bulunamadı.")}else{
fetch("./members.json?v="+Date.now(),{cache:"no-store"})
.then(r=>{if(!r.ok)throw new Error();return r.json()})
.then(members=>{
 const m=members[kod];
 if(!m){hata("Kart doğrulanamadı.<br><br>Geçersiz kart.");return}
 const aktif=String(m.durum||"").trim().toLowerCase()==="aktif";
 const kartLinki="https://kucukkuyufb.github.io/kucukkuyu-kart/?k="+encodeURIComponent(kod);
 const qrLinki="https://quickchart.io/qr?size=400&text="+encodeURIComponent(kartLinki);
 document.getElementById("kart").className="content";
 document.getElementById("kart").innerHTML=`
   <div class="status ${aktif?"aktif":"pasif"}">${aktif?"AKTİF ÜYE":"PASİF ÜYE"}</div>
   <div class="name">${esc(m.adSoyad)}</div>
   <div class="type">${esc(m.tip)}</div>
   <div class="memberNo">Üye No<strong>${esc(m.uyeNo)}</strong></div>
   <div class="grid">
     <div class="row"><span class="label">Aylık Aidat</span><span class="value">${esc(m.aylikAidat)} TL</span></div>
     <div class="row"><span class="label">Son Ödeme</span><span class="value">${esc(m.sonOdeme)}</span></div>
     <div class="row"><span class="label">Durum</span><span class="value">${esc(m.durum)}</span></div>
   </div>
   <div class="qrBox">
     <div class="qrTitle">Kart QR Kodu</div>
     <img class="qrImage" src="${qrLinki}" alt="Kart QR Kodu">
     <div class="qrNote">Bu QR kod okutulduğunda bu dijital taraftar kartı açılır.</div>
   </div>
   <div class="code">Kart Kodu: ${esc(kod)}</div>`;
})
.catch(()=>hata("Kart bilgileri alınamadı."));
}
</script>
