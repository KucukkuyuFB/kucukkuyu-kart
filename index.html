<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#071d49">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Taraftar Kartı">
<link rel="manifest" href="./manifest.json?v=2">
<link rel="apple-touch-icon" href="./icon-192.png">
<script>
window.pwaInstallPrompt=null;
window.addEventListener("beforeinstallprompt",function(e){
  e.preventDefault();
  window.pwaInstallPrompt=e;
  window.dispatchEvent(new Event("pwaPromptReady"));
});
</script>
<title>Küçükkuyu Fenerbahçe Gönüllüleri Taraftar Kartı</title>
<style>
:root{--navy:#071d49;--navy2:#103c7a;--yellow:#ffd500;--green:#17823b;--red:#b42318}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(180deg,#061632 0%,#0b2a5b 42%,#f3f5f8 42%);min-height:100vh;color:#0b1e3d}
.wrap{width:100%;max-width:520px;margin:0 auto;padding:22px 16px 36px}
.top{text-align:center;color:#fff;padding:8px 8px 18px}
.logoBox{width:200px;height:200px;margin:0 auto 12px;background:transparent;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:visible}
.logo{width:194px;height:194px;object-fit:contain;display:block;opacity:1;filter:none;image-rendering:auto}
.title{font-size:21px;font-weight:900;line-height:1.2;margin:8px 0 4px;letter-spacing:.3px;color:#fff}
.subtitle{font-size:13px;font-weight:700;letter-spacing:1.6px;color:var(--yellow)}
.card{background:#fff;border-radius:26px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.22);border:1px solid rgba(255,213,0,.45)}
.band{height:9px;background:linear-gradient(90deg,var(--yellow) 0 50%,var(--navy) 50% 100%)}
.content{padding:26px 22px 24px;background:linear-gradient(180deg,#fff,#fbfaf4)}
.status{display:inline-block;padding:9px 17px;border-radius:999px;font-size:13px;font-weight:900;letter-spacing:.5px}
.aktif{background:#dff4e5;color:var(--green)}
.pasif{background:#fde3e1;color:var(--red)}
.name{font-size:29px;font-weight:900;color:var(--navy);margin:18px 0 10px}

.topHeader{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:18px}
.topLeft{flex:1;min-width:0}
.memberTypeBadge{display:inline-block;background:#fff1a8;color:#071d49;font-size:14px;font-weight:900;padding:9px 16px;border-radius:999px;margin:0 0 16px}
.memberName{font-size:29px;line-height:1.1;font-weight:900;color:#071d49;margin:0}
.topRight{min-width:105px;text-align:right;padding-top:6px}
.memberNoLabel{font-size:12px;color:#7b8494;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.memberNoValue{font-size:24px;font-weight:900;color:#071d49;line-height:1.1}

.membershipBadge{
  display:inline-block;
  background:#fff1a8;
  color:#071d49;
  font-size:14px;
  font-weight:800;
  padding:8px 14px;
  border-radius:999px;
  margin:0 0 18px;
}

.thanksSlim{margin-top:18px;padding:14px 16px;border-left:4px solid var(--yellow);background:#f7f9fc;border-radius:12px;color:var(--navy);font-size:13px;font-weight:800;line-height:1.55}
.aidatAlert{margin-top:14px;padding:13px 15px;border-radius:12px;font-size:13px;font-weight:800;line-height:1.45}
.aidatAlert.yellow{background:#fff7cf;border:1px solid #efd66a;color:#6d5600}
.aidatAlert.red{background:#fff0f0;border:1px solid #e7a4a4;color:#9b1c1c}
.grid{margin-top:24px;border:1px solid #e9edf3;border-radius:18px;overflow:hidden;background:#fff}
.row{display:flex;justify-content:space-between;gap:16px;text-align:left;padding:15px 16px;border-bottom:1px solid #edf0f4}
.row:last-child{border-bottom:0}
.label{font-size:12px;color:#7b8494;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.labelNote{display:block;margin-top:5px;font-size:10px;line-height:1.35;font-weight:600;text-transform:none;letter-spacing:0;color:#9aa2af;max-width:210px}
.value{font-size:16px;color:#111f3a;font-weight:800;text-align:right}
.announcements{margin-top:20px}
.annTitle{font-size:13px;font-weight:900;color:#071d49;text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
.annCard{background:#f7f9fc;border:1px solid #e1e7ef;border-left:4px solid #ffd500;border-radius:14px;padding:13px 14px;margin-top:9px}
.annCard:first-of-type{margin-top:0}
.annHead{font-size:15px;font-weight:900;color:#071d49;margin-bottom:6px}
.annText{font-size:13px;line-height:1.5;color:#334155;font-weight:600}
.annBtn{display:inline-block;margin-top:10px;text-decoration:none;background:#071d49;color:#fff;font-size:12px;font-weight:900;padding:9px 12px;border-radius:10px}
.qrBox{margin-top:20px;background:#fff;border:1px solid #e9edf3;border-radius:18px;padding:16px;text-align:center}
.qrTitle{font-size:12px;color:#7b8494;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.qrImage{width:180px;height:180px;object-fit:contain;display:block;margin:0 auto 8px;background:#fff}
.qrNote{font-size:11px;color:#8a93a2;line-height:1.4}
.thanksBox{margin-top:18px;padding:15px 16px;border-radius:16px;background:#f4f7fb;border:1px solid #e1e7ef;color:var(--navy);font-size:14px;font-weight:800;line-height:1.5}
.verifyContent{padding:30px 22px 28px;background:linear-gradient(180deg,#fff,#fbfaf4);text-align:center}
.verifyIcon{width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:38px;font-weight:900}
.verifyIcon.active{background:#dff4e5;color:#17823b}
.verifyIcon.passive{background:#fde3e1;color:#b42318}
.verifyBadge{display:inline-block;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:900;letter-spacing:.5px;margin-bottom:16px}
.verifyBadge.active{background:#dff4e5;color:#17823b}
.verifyBadge.passive{background:#fde3e1;color:#b42318}
.verifyTitle{font-size:24px;font-weight:900;color:#071d49;margin:2px 0 14px;line-height:1.25}
.verifyText{font-size:18px;line-height:1.65;color:#0b1e3d;font-weight:800;background:#f7f9fc;border-radius:18px;padding:19px 17px;border:1px solid #e3e8f0}
.verifyText strong{color:#071d49}
.verifyNote{margin-top:16px;font-size:11px;color:#7b8494;font-weight:700;line-height:1.5}
.partnerBtn{display:block;margin-top:18px;text-decoration:none;background:#ffd500;color:#071d49;font-weight:900;text-align:center;padding:14px 16px;border-radius:14px;border:1px solid #e2bd00;box-shadow:0 6px 16px rgba(7,29,73,.12)}
.announcementsBtn{position:relative;display:block;margin-top:12px;text-decoration:none;background:#071d49;color:#fff;font-weight:900;text-align:center;padding:14px 16px;border-radius:14px;box-shadow:0 6px 16px rgba(7,29,73,.16)}
.announceDot{position:absolute;top:-5px;right:-5px;width:13px;height:13px;border-radius:50%;background:#e00000;border:3px solid #fff;box-shadow:0 0 0 2px rgba(224,0,0,.18);display:none}
.announceDot.active{display:block;animation:announceBlink 1s infinite}
@keyframes announceBlink{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.35);opacity:.45}}
.installBtn{display:block;width:100%;margin-top:12px;border:0;background:#071d49;color:#fff;font:inherit;font-weight:900;text-align:center;padding:14px 16px;border-radius:14px;cursor:pointer;box-shadow:0 6px 16px rgba(7,29,73,.16);text-decoration:none}
.installBtn[hidden]{display:none}.installBtn:disabled{opacity:.55;cursor:default}
.installHelp{display:none;margin-top:12px;padding:13px 14px;border-radius:12px;background:#f7f9fc;border:1px solid #e2e8f0;color:#334155;font-size:12px;line-height:1.5}
.installHelp.show{display:block}
.partnerBtn:active{transform:translateY(1px)}
.code{margin-top:17px;font-size:11px;color:#8a93a2;word-break:break-all}
.footer{text-align:center;margin-top:15px;color:#dbe5f6;font-size:12px}
.loading,.error{padding:34px 20px;text-align:center;font-size:18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logoBox">
      <img class="logo" src="./logo-real.svg?v=34" alt="Küçükkuyu Fenerbahçe Gönüllüleri">
    </div>
    <div class="title">KÜÇÜKKUYU FENERBAHÇE GÖNÜLLÜLERİ</div>
    <div class="subtitle">DİJİTAL TARAFTAR KARTI</div>
  </div>

  <div class="card">
    <div class="band"></div>
    <div id="kart" class="loading">Kart bilgileri yükleniyor...</div>
  </div>

  <div class="footer">Küçükkuyu Fenerbahçe Gönüllüleri</div>
</div>

<script>
const params=new URLSearchParams(location.search);
const kod=params.get("k");
const mode=params.get("mode");
const appMode=params.get("app")==="1";
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function hata(m){document.getElementById("kart").className="error";document.getElementById("kart").innerHTML=m}
function tarihTR(v){
 const s=String(v||"").trim();
 const m=s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/);
 if(!m) return null;
 return new Date(Number(m[3]),Number(m[2])-1,Number(m[1]));
}
function sureMetni(baslangic){
 const d=tarihTR(baslangic); if(!d) return "";
 const t=new Date(); t.setHours(0,0,0,0); d.setHours(0,0,0,0);
 if(d>t) return "";
 let ay=(t.getFullYear()-d.getFullYear())*12+(t.getMonth()-d.getMonth());
 let pivot=new Date(d.getFullYear(),d.getMonth()+ay,d.getDate());
 if(pivot>t){ay--;pivot=new Date(d.getFullYear(),d.getMonth()+ay,d.getDate())}
 const gun=Math.floor((t-pivot)/86400000);
 const yil=Math.floor(ay/12), kalanAy=ay%12, p=[];
 if(yil) p.push(yil+" yıl");
 if(kalanAy) p.push(kalanAy+" ay");
 if(gun || !p.length) p.push(gun+" gün");
 return p.join(" ");
}
function uyelikMesaji(m){
 const tip=String(m.uyelikTipi||m.tip||"").trim().toLowerCase();
 if(tip.includes("kurucu")) return "Kuruluşumuzda verdiğin destek ve ilk günden beri ailemizle olduğun için teşekkürler!";
 const sure=sureMetni(m.uyelikBaslangic);
 return sure ? sure+"dür ailemizle birlikte olduğun için teşekkürler!" : "Ailemize katıldığın için teşekkürler!";
}
function aidatDonemi(sonOdeme){
 const d=tarihTR(sonOdeme);
 if(!d) return null;
 const baslangic=new Date(d.getFullYear(),d.getMonth()+1,1);
 const son=new Date(d.getFullYear(),d.getMonth()+1,15);
 baslangic.setHours(0,0,0,0);
 son.setHours(0,0,0,0);
 return {baslangic:baslangic,son:son};
}
function tarihYaz(d){
 return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear();
}
function parseDuyuruTarihi(v){
 if(!v) return null;
 const p=String(v).trim().split(".");
 if(p.length!==3) return null;
 const d=new Date(Number(p[2]),Number(p[1])-1,Number(p[0]));
 d.setHours(0,0,0,0);
 return isNaN(d)?null:d;
}
function duyuruNoktasiGuncelle(){
 fetch("./duyurular.json?v="+Date.now(),{cache:"no-store"})
 .then(r=>r.ok?r.json():[])
 .then(list=>{
   const dot=document.getElementById("announceDot");
   if(!dot||!Array.isArray(list)) return;
   const bugun=new Date(); bugun.setHours(0,0,0,0);
   const aktif=list.some(x=>{
     const yayin=String(x.yayinda||x.yayin||"").trim().toLowerCase();
     if(!["evet","e","true","1","yayında","yayinda"].includes(yayin)) return false;
     const bas=parseDuyuruTarihi(x.baslangic||x.baslangicTarihi);
     const bit=parseDuyuruTarihi(x.bitis||x.bitisTarihi);
     if(bas&&bugun<bas) return false;
     if(bit&&bugun>bit) return false;
     return true;
   });
   dot.classList.toggle("active",aktif);
 }).catch(()=>{});
}
function aidatUyarisi(m){
 const donem=aidatDonemi(m.sonOdeme);
 if(!donem) return "";
 const bugun=new Date(); bugun.setHours(0,0,0,0);

 if(bugun>donem.son){
   const gecen=Math.floor((bugun-donem.son)/86400000);
   return '<div class="aidatAlert red">Aidat ödeme süresi '+esc(tarihYaz(donem.son))+' tarihinde sona erdi. '+gecen+' gündür gecikmede.</div>';
 }

 if(bugun>=donem.baslangic){
   const kalan=Math.ceil((donem.son-bugun)/86400000);
   if(kalan<=5){
     const metin=kalan===0 ? "bugün son gün" : "son "+kalan+" gün";
     return '<div class="aidatAlert yellow">Aidat ödeme dönemi açık. Son ödeme tarihi '+esc(tarihYaz(donem.son))+' — '+metin+'.</div>';
   }
 }
 return "";
}
if(kod){
  try{localStorage.setItem("lastCardUrl", window.location.href);}catch(e){}
}
if(!kod){hata("Kart kodu bulunamadı.")}else{
fetch("./members.json?v="+Date.now(),{cache:"no-store"})
.then(r=>{if(!r.ok)throw new Error();return r.json()})
.then(members=>{
 const liste=Array.isArray(members)?members:Object.values(members||{});
 const m=liste.find(function(x){return String(x.kartKodu||"").trim()===String(kod||"").trim();});
 if(!m){hata("Kart doğrulanamadı.<br><br>Geçersiz kart.");return}
 const aktif=String(m.durum||"").trim().toLowerCase()==="aktif";
 const kartLinki="https://kucukkuyufb.github.io/kucukkuyu-kart/?k="+encodeURIComponent(kod);
 const verifyLinki="https://kucukkuyufb.github.io/kucukkuyu-kart/verify.html?k="+encodeURIComponent(kod);
 const qrLinki="https://quickchart.io/qr?size=400&text="+encodeURIComponent(verifyLinki);
 document.getElementById("kart").className="content";
 document.getElementById("kart").innerHTML=
   '<div class="topHeader">'+
     '<div class="topLeft">'+
       '<div class="memberTypeBadge">'+esc(m.uyelikTipi||m.tip||"")+'</div>'+
       '<div class="memberName">'+esc(m.adSoyad)+'</div>'+
     '</div>'+
     '<div class="topRight">'+
       '<div class="memberNoLabel">ÜYE NO</div>'+
       '<div class="memberNoValue">'+esc(m.uyeNo)+'</div>'+
     '</div>'+
   '</div>'+
   
   
   (aktif ? '<div class="thanksSlim">'+esc(uyelikMesaji(m))+'</div>' : '')+
   (aktif ? aidatUyarisi(m) : '')+
   '<div class="grid">'+
     '<div class="row"><span class="label">Üyelik Durumu</span><span class="value">'+esc(m.durum)+'</span></div>'+
     '<div class="row"><span class="label">Üyelik Başlangıç Tarihi</span><span class="value">'+esc(m.uyelikBaslangic||"-")+'</span></div>'+
     '<div class="row"><span class="label">Aidat Son Ödeme Tarihi<span class="labelNote">Üye aidatları her ayın en geç 15\'ine kadar ödenmelidir!</span></span><span class="value">'+(aidatDonemi(m.sonOdeme)?tarihYaz(aidatDonemi(m.sonOdeme).son):"-")+'</span></div>'+
     '<div class="row"><span class="label">Aidat Tutarı</span><span class="value">'+esc(m.aylikAidat)+' TL</span></div>'+
   '</div>'+
   '<div class="qrBox">'+
     '<div class="qrTitle">Kart QR Kodu</div>'+
     '<img class="qrImage" src="'+qrLinki+'" alt="Kart QR Kodu">'+
     '<div class="qrNote">Bu QR kod okutulduğunda üyelik doğrulama sayfası açılır.</div>'+
   '</div>'+
   '<a id="announcementsBtn" class="announcementsBtn" href="./duyurular.html?k='+encodeURIComponent(kod)+'">Duyurular<span id="announceDot" class="announceDot"></span></a>'+ 
     '<a class="partnerBtn" href="./isyerleri.html?k='+encodeURIComponent(kod)+'&v=37">Üye İşyerlerini Gör</a>'+

   '<div class="code">Kart Kodu: '+esc(kod)+'</div>';
 duyuruNoktasiGuncelle();
})
.catch(()=>hata("Kart bilgileri alınamadı."));
}

function syncInstallButton(){
  const btn=document.getElementById("installAppBtn");
  if(!btn) return;

  const isStandalone=window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone===true;
  if(isStandalone){
    btn.textContent="✓ Kart Telefona Eklendi";
    btn.disabled=true;
    return;
  }

  btn.disabled=false;
  btn.textContent="📱 Kartımı Ana Ekrana Ekle";
}

window.addEventListener("pwaPromptReady",syncInstallButton);
window.addEventListener("appinstalled",function(){
  window.pwaInstallPrompt=null;
  const btn=document.getElementById("installAppBtn");
  if(btn){
    btn.disabled=true;
    btn.textContent="✓ Kart Telefona Eklendi";
  }
});

document.addEventListener("click",async function(e){
  if(!e.target || e.target.id!=="installAppBtn") return;

  if(window.pwaInstallPrompt){
    try{
      window.pwaInstallPrompt.prompt();
      const choice=await window.pwaInstallPrompt.userChoice;
      if(choice && choice.outcome==="accepted"){
        e.target.textContent="✓ Kurulum Onaylandı";
        e.target.disabled=true;
      }
    }catch(err){}
    window.pwaInstallPrompt=null;
    return;
  }

  const help=document.getElementById("installHelp");
  if(help){
    help.innerHTML='Bu telefonda Chrome henüz doğrudan kurulum izni vermedi. Bir süre sonra tekrar deneyebilirsin.';
    help.classList.add("show");
  }
});

setTimeout(syncInstallButton,0);
</script>
<script>
(function(){
  if("serviceWorker" in navigator){
    navigator.serviceWorker.getRegistrations().then(function(rs){
      rs.forEach(function(r){r.unregister();});
    }).catch(function(){});
  }
  if("caches" in window){
    caches.keys().then(function(keys){
      keys.forEach(function(k){caches.delete(k);});
    }).catch(function(){});
  }
})();
</script>
</body>
</html>
