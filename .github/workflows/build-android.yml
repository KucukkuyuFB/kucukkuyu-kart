name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        working-directory: android-app
        run: gradle assembleDebug
      - name: Publish APK to site
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk Kucukkuyu-Taraftar-Karti.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Kucukkuyu-Taraftar-Karti.apk
          git diff --cached --quiet || git commit -m "Android APK dosyasını güncelle"
          git push
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kucukkuyu-Taraftar-Karti
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
