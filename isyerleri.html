<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Üye İşyerleri</title>
<style>
:root{--navy:#071d49;--yellow:#ffd500;--muted:#6b7280}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(180deg,#071d49 0,#0b2a5b 34%,#f3f5f8 34%);min-height:100vh;color:#071d49}
.wrap{width:100%;max-width:620px;margin:0 auto;padding:24px 16px 40px}
.head{text-align:center;color:#fff;padding:8px 10px 24px}
.head h1{margin:0 0 6px;font-size:25px;font-weight:900}
.head p{margin:0;color:var(--yellow);font-size:13px;font-weight:800;letter-spacing:1px}
.panel{background:#fff;border-radius:26px;border:1px solid rgba(255,213,0,.5);box-shadow:0 18px 45px rgba(0,0,0,.18);overflow:hidden}
.band{height:9px;background:linear-gradient(90deg,var(--yellow) 0 50%,var(--navy) 50%)}
.content{padding:24px}
.intro{font-size:15px;line-height:1.6;color:#334155;margin-bottom:18px;text-align:center}
.empty{padding:28px 18px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:18px;text-align:center}
.empty strong{display:block;font-size:18px;margin-bottom:8px;color:var(--navy)}
.empty span{font-size:13px;color:var(--muted);line-height:1.5}
.bizCard{padding:16px;border:1px solid #e5e7eb;border-radius:16px;background:#f8fafc;margin-bottom:12px}
.bizTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.bizName{font-size:18px;font-weight:900;color:var(--navy)}
.bizCat{font-size:11px;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:.5px}
.bizDeal{display:inline-block;margin-top:10px;background:#fff3a8;color:#071d49;font-size:13px;font-weight:900;padding:8px 10px;border-radius:10px}
.bizInfo{margin-top:10px;font-size:13px;line-height:1.5;color:#475569}
.bizActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.bizBtn{display:inline-block;text-decoration:none;background:var(--navy);color:#fff;font-size:12px;font-weight:900;padding:9px 11px;border-radius:10px}
.back{display:block;margin-top:18px;text-decoration:none;background:var(--navy);color:#fff;font-weight:900;text-align:center;padding:13px 16px;border-radius:14px}
.footer{text-align:center;color:#dbe5f6;font-size:11px;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>KÜÇÜKKUYU FENERBAHÇE GÖNÜLLÜLERİ</h1>
    <p>ÜYE İŞYERLERİ</p>
  </div>
  <div class="panel">
    <div class="band"></div>
    <div class="content">
      <div class="intro">Anlaşmalı üye işyerlerimizi ve üyelerimize özel avantajları burada görebilirsiniz.</div>
      <div id="businessList" class="empty">
        <strong>Üye işyerleri yükleniyor</strong>
        <span>Lütfen bekleyin.</span>
      </div>
      <a class="back" id="backLink" href="./">Kartıma Dön</a>
    </div>
  </div>
  <div class="footer">Küçükkuyu Fenerbahçe Gönüllüleri</div>
</div>
<script>
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
fetch("./isyerleri.json?v="+Date.now(),{cache:"no-store"})
.then(r=>r.ok?r.json():[])
.then(list=>{
  const el=document.getElementById("businessList");
  const aktif=(Array.isArray(list)?list:[]).filter(x=>{
    const v=String(x.aktif||x.aktifMi||"").trim().toLowerCase();
    return ["evet","e","true","1","aktif"].includes(v);
  }).sort((a,b)=>(Number(a.oncelik)||999)-(Number(b.oncelik)||999));
  if(!aktif.length){
    el.className="empty";
    el.innerHTML='<strong>Henüz aktif üye işyeri yok</strong><span>Yeni anlaşmalı işletmeler eklendiğinde burada görünecek.</span>';
    return;
  }
  el.className="";
  el.innerHTML=aktif.map(x=>{
    const tel=x.telefon?'<a class="bizBtn" href="tel:'+esc(String(x.telefon).replace(/\s+/g,""))+'">Ara</a>':"";
    const harita=x.haritaLinki?'<a class="bizBtn" href="'+esc(x.haritaLinki)+'" target="_blank" rel="noopener">Haritada Gör</a>':"";
    const not=x.not?'<div class="bizInfo">'+esc(x.not)+'</div>':"";
    const adres=x.adres?'<div class="bizInfo">'+esc(x.adres)+'</div>':"";
    return '<div class="bizCard"><div class="bizTop"><div><div class="bizName">'+esc(x.isyeriAdi||"İşyeri")+'</div><div class="bizCat">'+esc(x.kategori||"")+'</div></div></div><div class="bizDeal">'+esc(x.avantaj||"Üyelere özel avantaj")+'</div>'+adres+not+'<div class="bizActions">'+tel+harita+'</div></div>';
  }).join("");
}).catch(()=>{
  const el=document.getElementById("businessList");
  el.className="empty";
  el.innerHTML='<strong>Liste yüklenemedi</strong><span>Lütfen daha sonra tekrar deneyin.</span>';
});

const params=new URLSearchParams(window.location.search);
const backKod=params.get("k");
const backLink=document.getElementById("backLink");

let hedef="";
if(backKod){
  hedef="./?k="+encodeURIComponent(backKod)+"&v=38";
}

if(!hedef){
  try{
    const saved=localStorage.getItem("lastCardUrl");
    if(saved && saved.includes("?k=")) hedef=saved;
  }catch(e){}
}

if(!hedef && document.referrer && document.referrer.includes("/kucukkuyu-kart/") && document.referrer.includes("?k=")){
  hedef=document.referrer;
}

backLink.addEventListener("click",function(e){
  e.preventDefault();
  if(hedef){
    window.location.href=hedef;
  }else if(history.length>1){
    history.back();
  }else{
    window.location.href="./";
  }
});
</script>
</body>
</html>
